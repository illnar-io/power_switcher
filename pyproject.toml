[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "power_switcher"
version = "0.1.0"
description = "DE-independent keyboard layout auto-switcher for Linux Wayland"
readme = "README.md"
authors = [{name = "Illnar", email = "illnar@example.com"}]
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "evdev>=1.7.0",
    "dasbus>=1.7",
    "click>=8.1",
]

[project.optional-dependencies]
lingua = ["lingua-language-detector>=2.0"]
tray   = ["pystray>=0.19", "Pillow>=10.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["power_switcher*"]
exclude = ["data*", "udev*", "systemd*", "tests*"]

[project.scripts]
power_switcher = "power_switcher.__main__:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "strict"
